{% extends "base.html" %}
{% block title %}Toolbar{% endblock %}
{% block head %}<style>.tool{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:8px;border:1px solid #e3e6ef;background:#fff;cursor:pointer;margin-right:8px}</style>{% endblock %}
{% block content %}
<div class="card"><h1>Document toolbar</h1>
  <div>
    <button class="tool" aria-label="Settings" onclick="document.getElementById('s').textContent='Settings opened'" data-gt="icon-settings">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="#333" stroke-width="2"/><circle cx="10" cy="10" r="2" fill="#333"/></svg></button>
    <span class="tool" title="Delete document" onclick="document.getElementById('s').textContent='Delete requested'" data-gt="icon-delete">
      <svg width="18" height="18" viewBox="0 0 18 18" class="icon-trash"><rect x="4" y="5" width="10" height="11" fill="#d33"/><rect x="3" y="2" width="12" height="2" fill="#d33"/></svg></span>
    <div class="tool" onclick="document.getElementById('s').textContent='Added to favorites'" data-gt="icon-star"><span style="color:#e6a700;font-size:20px">★</span></div>
  </div>
  <p id="s" role="status" class="muted">Ready</p>
</div>
{% endblock %}
