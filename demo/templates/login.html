{% extends "base.html" %}
{% block title %}Sign in - Acme Portal{% endblock %}
{% block header_login %}{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:auto">
  <h1>Sign in</h1>
  {% if error %}<div class="alert" role="alert" data-gt="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" aria-label="Login form" id="login-form">
    <label for="email">Email address</label>
    <input id="email" name="identifier" type="text" autocomplete="username" placeholder="you@example.com" value="{{ identifier }}" data-testid="login-email" data-gt="login-username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password" data-gt="login-password">
    <div class="check"><input type="checkbox" id="remember" name="remember" data-gt="login-remember"><label for="remember">Remember me</label></div>
    <p><a href="#" data-gt="login-forgot">Forgot password?</a></p>
    <button type="submit" id="login-btn" data-testid="login-submit" data-gt="login-submit">Sign In</button>
  </form>
</div>
{% endblock %}
