<!doctype html><html><head><title>Newsletter frame</title><style>body{font-family:system-ui;padding:12px} input{padding:8px;width:70%} button{padding:8px 14px}</style></head>
<body>
<h2>Subscribe to our newsletter</h2>
<form onsubmit="event.preventDefault(); document.getElementById('nl_status').textContent='Subscribed: ' + document.getElementById('nl_email').value;">
  <label for="nl_email">Newsletter email</label><br>
  <input id="nl_email" type="email" data-gt="iframe-email"> <button type="submit" data-gt="iframe-subscribe">Subscribe</button>
</form>
<p id="nl_status" role="status"></p>
<script>
  (function () {
    function report(type, target) {
      try {
        var el = target && target.closest ? target.closest('[data-gt]') : null;
        var payload = JSON.stringify({type: type, gt: el ? el.getAttribute('data-gt') : null, tag: target && target.tagName,
          path: location.pathname, value: target && target.value ? String(target.value).slice(0, 40) : null});
        navigator.sendBeacon('/__events', new Blob([payload], {type: 'application/json'}));
      } catch (e) {}
    }
    document.addEventListener('click', function (e) { report('click', e.target); }, true);
    document.addEventListener('change', function (e) { report('change', e.target); }, true);
  })();
</script>
</body></html>
