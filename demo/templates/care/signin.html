{% extends "care/base.html" %}
{% block title %}Sign in · CareLink{% endblock %}
{% block appbar %}{% endblock %}
{% block content %}
<div style="max-width:380px;margin:80px auto" class="panel">
  <h2 style="margin-top:0">Sign in</h2>
  <p class="muted">Patient services portal</p>
  {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/care/sign-in" autocomplete="off">
    <div class="field"><label class="lbl" for="email">Email</label>
      <input class="input" id="email" name="email" type="email" value="{{ email or '' }}" data-gt="care-email"></div>
    <div class="field"><label class="lbl" for="pwd">Password</label>
      <input class="input" id="pwd" name="password" type="password" data-gt="care-password"></div>
    <div class="field"><a href="#" class="muted" data-gt="care-forgot">Forgot password?</a></div>
    <button class="btn" type="submit" style="width:100%" data-gt="care-login">Login</button>
  </form>
</div>
{% endblock %}
