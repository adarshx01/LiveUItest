<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CareLink{% endblock %}</title>
<style>
  :root { --bg:#f3f6f9; --card:#fff; --ink:#1b2a3a; --muted:#61707f; --brand:#0b6e8a; --line:#dde4ea; --danger:#c62f2f; --ok:#16794a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: "Segoe UI", Roboto, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  .appbar { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 20px; background:var(--brand); color:#fff; }
  .appbar .logo { font-weight:700; letter-spacing:.3px; }
  .appbar a { color:#fff; text-decoration:none; margin-left:16px; font-size:14px; }
  .wrap { max-width:1080px; margin:24px auto; padding:0 16px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:16px; }
  .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:4px; padding:9px 18px; font-size:14px; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  .field { margin-bottom:14px; position:relative; }
  .field > .lbl { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px; }
  .input { width:100%; height:38px; padding:0 10px; border:1px solid #c5cfd8; border-radius:4px; font-size:14px; background:#fff; }
  .input[readonly] { cursor:pointer; background:#fff; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--danger); font-size:13px; margin:8px 0; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block appbar %}
<div class="appbar"><span class="logo">CareLink</span>
  {% if care_user %}<span><span class="muted" style="color:#d6ecf2">{{ care_user }}</span><a href="/care/home" data-gt="care-nav-home">Programs</a><a href="/care/logout" data-gt="care-nav-logout">Sign out</a></span>{% endif %}
</div>
{% endblock %}
<div class="wrap">{% block content %}{% endblock %}</div>
<div id="overlay-container"></div>
<script>
  (function () {
    function report(type, target) {
      try {
        var el = target && target.closest ? target.closest('[data-gt]') : null;
        var payload = JSON.stringify({type: type, gt: el ? el.getAttribute('data-gt') : null, tag: target && target.tagName,
          path: location.pathname, value: target && target.type === 'password' ? '***' : (target && target.value ? String(target.value).slice(0, 40) : null)});
        navigator.sendBeacon('/__events', new Blob([payload], {type: 'application/json'}));
      } catch (e) {}
    }
    document.addEventListener('click', function (e) { report('click', e.target); }, true);
    document.addEventListener('change', function (e) { report('change', e.target); }, true);
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
