{% extends "base.html" %}
{% block title %}Cart - Acme Portal{% endblock %}
{% block content %}
<div class="card">
  <h1>Your cart</h1>
  {% if items %}
  <table aria-label="Cart items"><tbody>
    {% for p in items %}<tr><td>{{ p.name }}</td><td>${{ p.price }}</td></tr>{% endfor %}
  </tbody></table>
  <p><strong>Total: ${{ total }}</strong></p>
  <form method="post" action="/checkout"><button type="submit" data-gt="cart-place-order">Place order</button></form>
  {% else %}<p>Your cart is empty.</p>{% endif %}
</div>
{% endblock %}
