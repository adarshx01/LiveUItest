{% extends "base.html" %}
{% block title %}Security check{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:auto">
  <h1>Security check</h1>
  <p>Please verify you are human to continue.</p>
  <form method="post" action="/challenge/verify" class="g-recaptcha" data-sitekey="demo-site-key">
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <div class="check"><input type="checkbox" id="human" name="human" required data-gt="captcha-checkbox" onchange="this.form.submit()"><label for="human">I'm not a robot</label></div>
  </form>
</div>
{% endblock %}
