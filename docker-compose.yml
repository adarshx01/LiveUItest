# Full platform: PostgreSQL + pgvector, Redis, S3-compatible storage, API, worker,
# browser worker (Playwright MCP over HTTP), frontend and the demo application.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: aitest, POSTGRES_PASSWORD: aitest, POSTGRES_DB: aitest }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aitest"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: aitest, MINIO_ROOT_PASSWORD: aitest-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  browser:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.browser }
    expose: ["8931"]
    shm_size: 1gb
  api:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.backend }
    env_file: .env
    environment: &backend_env
      AITEST_DATABASE_URL: postgresql+asyncpg://aitest:aitest@postgres:5432/aitest
      AITEST_CHECKPOINT_DATABASE_URL: postgresql://aitest:aitest@postgres:5432/aitest
      AITEST_REDIS_URL: redis://redis:6379/0
      AITEST_MCP_TRANSPORT: http
      AITEST_MCP_HTTP_URL: http://browser:8931/mcp
      AITEST_ARTIFACT_BACKEND: s3
      AITEST_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: aitest
      AWS_SECRET_ACCESS_KEY: aitest-secret
      AITEST_RUN_WORKER_IN_API: "false"
      AITEST_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started }, browser: { condition: service_started } }
    ports: ["8000:8000"]
  worker:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.backend }
    env_file: .env
    environment: *backend_env
    command: ["python", "-m", "backend.workers.execution_worker"]
    depends_on: [api]
    deploy: { replicas: 2 }
  frontend:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
  demo:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.backend }
    command: ["python", "-m", "demo.app"]
    environment: { DEMO_HOST: 0.0.0.0 }
    ports: ["8800:8800"]
volumes:
  pgdata: {}
  miniodata: {}
